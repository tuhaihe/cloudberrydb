name: Sandbox Weekly Validation

on:
  # Run every Monday at 02:00 UTC (weekly validation)
  schedule:
    - cron: '0 2 * * 1'
  
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - single-node
          - multi-node

  # Run on changes to sandbox files
  push:
    paths:
      - 'devops/sandbox/**'
      - '.github/workflows/sandbox-validation.yml'
  
  pull_request:
    paths:
      - 'devops/sandbox/**'
      - '.github/workflows/sandbox-validation.yml'

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:

  test-single-node-build:
    name: Test Single Node Build
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'single-node' || github.event.inputs.test_type == '' || github.event_name == 'schedule'
    
    strategy:
      matrix:
        version: ['main', '2.0.0']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Clean Docker resources
        run: |
          docker system prune -af
          docker volume prune -f
      
      - name: Test single node deployment
        run: |
          cd devops/sandbox
          ./run.sh -c ${{ matrix.version }}
          
          # Stage 1: Wait for container to start
          echo "Stage 1: Waiting for container to start..."
          timeout 120 bash -c 'until docker ps | grep -q cbdb-cdw; do sleep 2; echo "Waiting for container..."; done'
          echo "✓ Container started"
          
          # Stage 2: Wait for SSH service
          echo "Stage 2: Waiting for SSH service..."
          timeout 120 bash -c 'until docker exec cbdb-cdw pgrep -f sshd > /dev/null 2>&1; do sleep 5; echo "Waiting for SSH..."; done'
          echo "✓ SSH service ready"
          
          # Stage 3: Wait for database initialization with error detection
          echo "Stage 3: Waiting for database initialization..."
          MAX_WAIT=600
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
              # Check for successful deployment
              if docker logs cbdb-cdw 2>&1 | grep -q "DEPLOYMENT SUCCESSFUL"; then
                  echo "✓ Deployment completed successfully!"
                  break
              fi
              
              # Check for errors
              if docker logs cbdb-cdw 2>&1 | grep -qE "ERROR|FATAL|failed to initialize"; then
                  echo "❌ Deployment failed! Check logs below:"
                  docker logs --tail 100 cbdb-cdw
                  exit 1
              fi
              
              sleep 10
              ELAPSED=$((ELAPSED + 10))
              if [ $((ELAPSED % 60)) -eq 0 ]; then
                  echo "Still waiting for deployment... ($ELAPSED/$MAX_WAIT seconds)"
              fi
          done
          
          if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "❌ Timeout waiting for deployment"
              docker logs --tail 100 cbdb-cdw
              exit 1
          fi
          
          # Stage 4: Verify database connectivity
          echo "Stage 4: Verifying database connectivity..."
          timeout 30 bash -c 'until docker exec -u gpadmin cbdb-cdw bash -l -c "psql -c \"SELECT 1\"" > /dev/null 2>&1; do sleep 2; echo "Waiting for database..."; done'
          echo "✓ Database is accessible"
          
          # Test basic database operations
          echo "Running database tests..."
          docker exec -u gpadmin cbdb-cdw bash -l -c "psql -c 'SELECT version()'"
          docker exec -u gpadmin cbdb-cdw bash -l -c "psql -c 'SELECT * from gp_segment_configuration'"
          docker exec -u gpadmin cbdb-cdw bash -l -c "psql -c 'SELECT * FROM pg_available_extensions'"
          
          echo "✅ Single node test (${{ matrix.version }}) completed successfully"
        timeout-minutes: 30
      
      - name: Check container logs on failure
        if: failure()
        run: |
          echo "=== Container Status ==="
          docker ps -a || true
          
          echo "=== Docker System Info ==="
          docker system df || true
          
          echo "=== Container Logs (last 200 lines) ==="
          docker logs --tail 200 cbdb-cdw || true
          
          echo "=== Container Processes ==="
          docker exec cbdb-cdw ps auxf || true
          
          echo "=== Container Resource Usage ==="
          docker stats --no-stream cbdb-cdw || true
          
          echo "=== Database Logs ==="
          docker exec cbdb-cdw bash -c 'find /data0/database -name "*.log" -type f -exec echo "--- {} ---" \; -exec tail -50 {} \;' || true
          
          echo "=== Checking for Core Dumps ==="
          docker exec cbdb-cdw find /data0 -name "core.*" -ls || true
      
      - name: Cleanup
        if: always()
        run: |
          docker rm -f cbdb-cdw || true
          docker system prune -af || true

  test-multi-node-build:
    name: Test Multi Node Build
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'multi-node' || github.event.inputs.test_type == '' || github.event_name == 'schedule'
    
    strategy:
      matrix:
        version: ['main', '2.0.0']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Clean Docker resources
        run: |
          docker system prune -af
          docker volume prune -f
      
      - name: Test multi-node deployment
        run: |
          cd devops/sandbox
          ./run.sh -c ${{ matrix.version }} -m
          
          # Stage 1: Verify all containers are running
          echo "Stage 1: Verifying all containers are running..."
          sleep 10  # Give docker compose time to start all containers
          for container in cbdb-cdw cbdb-scdw cbdb-sdw1 cbdb-sdw2; do
              if ! docker ps | grep -q $container; then
                  echo "❌ Container $container is not running!"
                  docker ps -a
                  exit 1
              fi
              echo "✓ Container $container is running"
          done
          
          # Stage 2: Wait for SSH services on all nodes
          echo "Stage 2: Waiting for SSH services on all nodes..."
          for container in cbdb-cdw cbdb-scdw cbdb-sdw1 cbdb-sdw2; do
              echo "Checking SSH on $container..."
              timeout 120 bash -c "until docker exec $container pgrep -f sshd > /dev/null 2>&1; do sleep 5; done"
              echo "✓ SSH ready on $container"
          done
          
          # Stage 3: Wait for database initialization with error detection (longer timeout for multi-node)
          echo "Stage 3: Waiting for multi-node database initialization..."
          MAX_WAIT=1200  # 20 minutes for multi-node
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
              # Check for successful deployment
              if docker logs cbdb-cdw 2>&1 | grep -q "DEPLOYMENT SUCCESSFUL"; then
                  echo "✓ Multi-node deployment completed successfully!"
                  break
              fi
              
              # Check for errors in coordinator logs
              if docker logs cbdb-cdw 2>&1 | grep -qE "ERROR|FATAL|failed to initialize|gpinitsystem.*failed"; then
                  echo "❌ Multi-node deployment failed! Check logs below:"
                  echo "=== Coordinator logs ==="
                  docker logs --tail 100 cbdb-cdw
                  exit 1
              fi
              
              sleep 15
              ELAPSED=$((ELAPSED + 15))
              if [ $((ELAPSED % 60)) -eq 0 ]; then
                  echo "Still waiting for multi-node deployment... ($ELAPSED/$MAX_WAIT seconds)"
              fi
          done
          
          if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "❌ Timeout waiting for multi-node deployment"
              docker logs --tail 100 cbdb-cdw
              exit 1
          fi
          
          # Stage 4: Verify database connectivity
          echo "Stage 4: Verifying database connectivity..."
          timeout 30 bash -c 'until docker exec -u gpadmin cbdb-cdw bash -l -c "psql -c \"SELECT 1\"" > /dev/null 2>&1; do sleep 2; echo "Waiting for database..."; done'
          echo "✓ Database is accessible"
          
          # Test basic database operations
          echo "Running database tests..."
          docker exec -u gpadmin cbdb-cdw bash -l -c "psql -c 'SELECT version()'"
          docker exec -u gpadmin cbdb-cdw bash -l -c "psql -c 'SELECT * from gp_segment_configuration'"
          docker exec -u gpadmin cbdb-cdw bash -l -c "psql -c 'SELECT * FROM pg_available_extensions'"
          
          echo "✅ Multi-node test (${{ matrix.version }}) completed successfully"
        timeout-minutes: 45
      
      - name: Check all container logs on failure
        if: failure()
        run: |
          echo "=== All Container Status ==="
          docker ps -a || true
          
          echo "=== Docker System Info ==="
          docker system df || true
          
          echo "=== Coordinator Logs (last 200 lines) ==="
          docker logs --tail 200 cbdb-cdw || true
          
          echo "=== Standby Coordinator Logs (last 100 lines) ==="
          docker logs --tail 100 cbdb-scdw || true
          
          echo "=== Segment 1 Logs (last 100 lines) ==="
          docker logs --tail 100 cbdb-sdw1 || true
          
          echo "=== Segment 2 Logs (last 100 lines) ==="
          docker logs --tail 100 cbdb-sdw2 || true
          
          echo "=== Coordinator Processes ==="
          docker exec cbdb-cdw ps auxf || true
          
          echo "=== Database Logs on Coordinator ==="
          docker exec cbdb-cdw bash -c 'find /data0/database -name "*.log" -type f -exec echo "--- {} ---" \; -exec tail -50 {} \;' || true
          
          echo "=== Network Status ==="
          docker network ls || true
          docker network inspect cbdb-interconnect || true
          
          echo "=== Checking for Core Dumps ==="
          docker exec cbdb-cdw find /data0 -name "core.*" -ls || true
      
      - name: Cleanup
        if: always()
        run: |
          cd devops/sandbox
          docker compose -f docker-compose-rockylinux9.yml down -v || true
          docker system prune -af || true

  notify-results:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test-single-node-build, test-multi-node-build]
    if: always()
    
    steps:
      - name: Generate Summary Report
        run: |
          # Determine status icons
          single_node_icon="❌"
          multi_node_icon="❌"
          overall_status="❌ FAILED"
          
          if [[ "${{ needs.test-single-node-build.result }}" == "success" ]]; then
            single_node_icon="✅"
          fi
          
          if [[ "${{ needs.test-multi-node-build.result }}" == "success" ]]; then
            multi_node_icon="✅"
          fi
          
          if [[ "${{ needs.test-single-node-build.result }}" == "success" ]] && \
             [[ "${{ needs.test-multi-node-build.result }}" == "success" ]]; then
            overall_status="✅ PASSED"
          fi
          
          # Generate GitHub Actions Summary
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🧪 Apache Cloudberry Sandbox Validation Report
          
          **Overall Status:** $overall_status
          
          | Test Type | Status | Versions Tested |
          |-----------|--------|-----------------|
          | Single Node | $single_node_icon ${{ needs.test-single-node-build.result }} | main, 2.0.0 |
          | Multi Node | $multi_node_icon ${{ needs.test-multi-node-build.result }} | main, 2.0.0 |
          
          **Generated on:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF
          
          # Also output to console for logs
          echo "Validation Results:"
          echo "- Single node test: ${{ needs.test-single-node-build.result }}"
          echo "- Multi node test: ${{ needs.test-multi-node-build.result }}"
          echo "- Overall status: $overall_status"
          
          # Set exit code based on results
          if [[ "${{ needs.test-single-node-build.result }}" == "failure" ]] || \
             [[ "${{ needs.test-multi-node-build.result }}" == "failure" ]]; then
            exit 1
          fi

