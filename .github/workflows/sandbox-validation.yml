name: Sandbox Validation

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday 02:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Deployment mode'
        type: choice
        default: 'all'
        options: [all, single-node, multi-node]
  push:
    paths: ['devops/sandbox/**', 'devops/build/**', '.github/workflows/sandbox-validation.yml']
  pull_request:
    paths: ['devops/sandbox/**', 'devops/build/**', '.github/workflows/sandbox-validation.yml']

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  OS_VERSION: rockylinux9
  DB_USER: gpadmin
  SSH_TIMEOUT: 120
  DB_CONNECT_TIMEOUT: 30
  POLL_INTERVAL: 10
  DEPLOY_TIMEOUT_SINGLE: 600
  DEPLOY_TIMEOUT_MULTI: 1200

jobs:
  validate:
    name: ${{ matrix.version }} ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1  # Serial execution: test one, cleanup, then next
      matrix:
        include:
          - version: '2.0.0'
            mode: single-node
            run_args: '-c 2.0.0'
          - version: '2.0.0'
            mode: multi-node
            run_args: '-c 2.0.0 -m'
          - version: main
            mode: single-node
            run_args: '-c main'
          - version: main
            mode: multi-node
            run_args: '-c main -m'

    steps:
      - name: Check if should run
        id: check
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]] || \
             [[ "$MODE" == "all" ]] || [[ "$MODE" == "${{ matrix.mode }}" ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping ${{ matrix.mode }} (requested: $MODE)"
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Run deployment
        if: steps.check.outputs.skip != 'true'
        run: |
          cd devops/sandbox
          echo "=== Running: ./run.sh ${{ matrix.run_args }} ==="
          ./run.sh ${{ matrix.run_args }}

      - name: Validate deployment
        if: steps.check.outputs.skip != 'true'
        timeout-minutes: 45
        run: |
          set -euo pipefail
          MODE="${{ matrix.mode }}"
          DEPLOY_TIMEOUT=$([[ "$MODE" == "single-node" ]] && echo $DEPLOY_TIMEOUT_SINGLE || echo $DEPLOY_TIMEOUT_MULTI)
          CONTAINER="cbdb-cdw"  # Same name for both modes (defined in docker-compose)

          # ==================== Helper Functions ====================
          wait_for_deployment() {
            local elapsed=0
            while [[ $elapsed -lt $DEPLOY_TIMEOUT ]]; do
              if docker logs "$CONTAINER" 2>&1 | grep -q "DEPLOYMENT SUCCESSFUL"; then
                echo "✓ Deployment completed"; return 0
              fi
              if docker logs "$CONTAINER" 2>&1 | grep -qE "FATAL|failed to initialize|gpinitsystem.*failed"; then
                echo "❌ Deployment failed"; docker logs --tail 100 "$CONTAINER"; return 1
              fi
              sleep $POLL_INTERVAL; elapsed=$((elapsed + POLL_INTERVAL))
              [[ $((elapsed % 60)) -eq 0 ]] && echo "  Waiting... (${elapsed}/${DEPLOY_TIMEOUT}s)"
            done
            echo "❌ Timeout"; docker logs --tail 100 "$CONTAINER"; return 1
          }

          # ==================== Validation ====================
          echo "=== Stage 1: Waiting for SSH ==="
          timeout $SSH_TIMEOUT bash -c "until docker exec $CONTAINER pgrep -f sshd >/dev/null 2>&1; do sleep 5; done"
          echo "✓ SSH ready"

          echo "=== Stage 2: Waiting for deployment ==="
          wait_for_deployment

          echo "=== Stage 3: Verifying database ==="
          timeout $DB_CONNECT_TIMEOUT bash -c \
            "until docker exec -u $DB_USER $CONTAINER bash -l -c 'psql -c \"SELECT 1\"' >/dev/null 2>&1; do sleep 2; done"
          echo "✓ Database accessible"

          echo "=== Stage 4: Running database tests ==="
          docker exec -u "$DB_USER" "$CONTAINER" bash -l -c "psql -c 'SELECT version()'"
          docker exec -u "$DB_USER" "$CONTAINER" bash -l -c "psql -c 'SELECT * FROM gp_segment_configuration'"

          echo "✅ ${{ matrix.version }} ${{ matrix.mode }} validation passed"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Container Status ===" && docker ps -a || true
          if [[ "${{ matrix.mode }}" == "single-node" ]]; then
            echo "=== Container Logs ===" && docker logs --tail 200 cbdb-cdw || true
          else
            for c in cbdb-cdw cbdb-scdw cbdb-sdw1 cbdb-sdw2; do
              echo "=== Logs: $c ===" && docker logs --tail 100 "$c" || true
            done
          fi

      - name: Cleanup
        if: always()
        run: |
          IMAGE="cbdb-${{ matrix.version }}:${OS_VERSION}"
          if [[ "${{ matrix.mode }}" == "single-node" ]]; then
            docker rm -f cbdb-cdw 2>/dev/null || true
          else
            cd devops/sandbox
            docker compose -f "docker-compose-${OS_VERSION}.yml" down -v 2>/dev/null || true
          fi
          docker rmi -f "$IMAGE" 2>/dev/null || true

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    steps:
      - name: Generate report
        run: |
          STATUS="${{ needs.validate.result }}"
          ICON=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Sandbox Validation Report
          **Status:** $ICON ${STATUS^^}
          **Tested:** 2.0.0 single/multi, main single/multi (serial)
          **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')
          EOF
          [[ "$STATUS" == "failure" ]] && exit 1 || true
