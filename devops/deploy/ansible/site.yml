# Apache Cloudberry - Bare Metal Deployment Playbook
#
# Usage:
#   ansible-playbook site.yml -i inventory/hosts \
#       -e package_path=./apache-cloudberry-db-incubating-2.1.0.el8.x86_64.rpm

---
- name: Configure all hosts
  hosts: cloudberry
  become: yes
  tasks:

    # --- SELinux ---
    # On RHEL/Rocky Linux, SELinux must be disabled.
    # On Ubuntu, SELinux is not installed by default and this task is skipped.
    # If SELinux is installed on Ubuntu, it will also be disabled.
    - name: Disable SELinux (RHEL/Rocky Linux)
      selinux:
        state: disabled
      when: ansible_os_family == "RedHat"

    - name: Disable SELinux if installed (Ubuntu)
      shell: |
        if dpkg -l selinux-basics &>/dev/null 2>&1; then
          setenforce 0 2>/dev/null || true
          sed -i 's/^SELINUX=.*/SELINUX=disabled/' /etc/selinux/config 2>/dev/null || true
          echo "SELinux disabled"
        else
          echo "SELinux not installed, skipping"
        fi
      args:
        executable: /bin/bash
      when: ansible_os_family == "Debian"
      register: selinux_ubuntu_result
      changed_when: "'SELinux disabled' in selinux_ubuntu_result.stdout"

    # --- Firewall ---
    # RHEL/Rocky Linux: stop and disable firewalld
    # Ubuntu: ufw is disabled by default; disable it if active
    - name: Stop and disable firewalld (RHEL/Rocky Linux)
      systemd:
        name: firewalld
        state: stopped
        enabled: no
      when: ansible_os_family == "RedHat"
      ignore_errors: yes

    - name: Disable ufw if active (Ubuntu)
      shell: |
        if ufw status | grep -q "Status: active"; then
          ufw disable
          echo "ufw disabled"
        else
          echo "ufw already inactive, skipping"
        fi
      args:
        executable: /bin/bash
      when: ansible_os_family == "Debian"
      register: ufw_result
      changed_when: "'ufw disabled' in ufw_result.stdout"

    # --- Hosts file ---
    - name: Set hostname
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Add cluster hosts to /etc/hosts
      lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item].ansible_host }}  {{ item }}"
        state: present
      loop: "{{ groups['cloudberry'] }}"

    # --- Kernel parameters ---
    # Dynamically calculate memory-dependent sysctl values based on each host's
    # actual physical memory and swap, following the official documentation formulas:
    #   kernel.shmall = _PHYS_PAGES / 2
    #   kernel.shmmax = (_PHYS_PAGES / 2) * PAGE_SIZE
    #   vm.overcommit_ratio = (RAM - 0.026 * gp_vmem) / RAM * 100
    #   vm.dirty_* uses bytes mode for >64GB RAM, ratio mode for <=64GB RAM
    #   vm.min_free_kbytes = MemTotal * 3%

    - name: Get system PAGE_SIZE
      command: getconf PAGE_SIZE
      register: _page_size_result
      changed_when: false

    - name: Calculate dynamic sysctl values
      set_fact:
        _ram_mb: "{{ ansible_memtotal_mb }}"
        _swap_mb: "{{ ansible_swaptotal_mb }}"
        _page_size: "{{ _page_size_result.stdout | int }}"

    - name: Calculate kernel.shmall and kernel.shmmax
      set_fact:
        _shmall: "{{ ((_ram_mb | int * 1024 / (_page_size | int)) / 2) | int }}"
        _shmmax: "{{ ((_ram_mb | int * 1024 / (_page_size | int)) / 2 * (_page_size | int)) | int }}"

    - name: Calculate vm.overcommit_ratio
      set_fact:
        _ram_gb: "{{ (_ram_mb | int / 1024) | float }}"
        _swap_gb: "{{ (_swap_mb | int / 1024) | float }}"

    - name: Calculate gp_vmem and overcommit_ratio
      set_fact:
        _gp_vmem: >-
          {{ ((_swap_gb | float + _ram_gb | float) - (7.5 + 0.05 * (_ram_gb | float)))
             / ((_ram_gb | float >= 256) | ternary(1.17, 1.7)) }}

    - name: Calculate final overcommit_ratio
      set_fact:
        _overcommit_ratio: "{{ ((_ram_gb | float - 0.026 * (_gp_vmem | float)) / (_ram_gb | float) * 100) | int }}"

    - name: Calculate vm.min_free_kbytes (3% of MemTotal in kB)
      set_fact:
        _min_free_kbytes: "{{ (_ram_mb | int * 1024 * 0.03) | round | int }}"

    - name: Set sysctl parameters (fixed values)
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_set: yes
        reload: yes
      loop: "{{ sysctl_fixed | dict2items }}"
      vars:
        sysctl_fixed:
          kernel.shmmni: "4096"
          vm.overcommit_memory: "2"
          net.ipv4.ip_local_port_range: "10000 65535"
          kernel.sem: "250 2048000 200 8192"
          kernel.sysrq: "1"
          kernel.core_uses_pid: "1"
          kernel.msgmnb: "65536"
          kernel.msgmax: "65536"
          kernel.msgmni: "2048"
          net.ipv4.tcp_syncookies: "1"
          net.ipv4.conf.default.accept_source_route: "0"
          net.ipv4.tcp_max_syn_backlog: "4096"
          net.ipv4.conf.all.arp_filter: "1"
          net.ipv4.ipfrag_high_thresh: "41943040"
          net.ipv4.ipfrag_low_thresh: "31457280"
          net.ipv4.ipfrag_time: "60"
          net.core.netdev_max_backlog: "10000"
          net.core.rmem_max: "2097152"
          net.core.wmem_max: "2097152"
          vm.swappiness: "10"
          vm.zone_reclaim_mode: "0"
          vm.dirty_expire_centisecs: "500"
          vm.dirty_writeback_centisecs: "100"
          kernel.core_pattern: "/var/core/core.%h.%t"

    - name: Set sysctl parameters (memory-dependent)
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_set: yes
        reload: yes
      loop:
        - { key: "kernel.shmall", value: "{{ _shmall }}" }
        - { key: "kernel.shmmax", value: "{{ _shmmax }}" }
        - { key: "vm.overcommit_ratio", value: "{{ _overcommit_ratio }}" }
        - { key: "vm.min_free_kbytes", value: "{{ _min_free_kbytes }}" }

    - name: Set sysctl dirty parameters for hosts with more than 64GB RAM (bytes mode)
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_set: yes
        reload: yes
      loop:
        - { key: "vm.dirty_background_ratio", value: "0" }
        - { key: "vm.dirty_ratio", value: "0" }
        - { key: "vm.dirty_background_bytes", value: "1610612736" }
        - { key: "vm.dirty_bytes", value: "4294967296" }
      when: _ram_mb | int > 65536

    - name: Set sysctl dirty parameters for hosts with 64GB RAM or less (ratio mode)
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_set: yes
        reload: yes
      loop:
        - { key: "vm.dirty_background_ratio", value: "3" }
        - { key: "vm.dirty_ratio", value: "10" }
      when: _ram_mb | int <= 65536
      # Per official docs: for systems with 64GB RAM or less, only set the ratio
      # parameters. vm.dirty_background_bytes and vm.dirty_bytes should be omitted
      # entirely, not set to 0.

    - name: Create core dump directory
      file:
        path: /var/core
        state: directory
        mode: "1777"

    # --- Resource limits ---
    - name: Set PAM limits
      pam_limits:
        domain: "*"
        limit_type: "{{ item.type }}"
        limit_item: "{{ item.item }}"
        value: "{{ item.value }}"
      loop:
        - { type: soft, item: nofile, value: "524288" }
        - { type: hard, item: nofile, value: "524288" }
        - { type: soft, item: nproc, value: "131072" }
        - { type: hard, item: nproc, value: "131072" }
        - { type: soft, item: core, value: unlimited }

    # --- XFS mount ---
    - name: Create XFS filesystem on data disk
      filesystem:
        fstype: xfs
        dev: "{{ data_disk }}"
        force: no
      ignore_errors: yes

    - name: Mount data disk
      mount:
        path: "{{ data_mount }}"
        src: "{{ data_disk }}"
        fstype: xfs
        opts: rw,nodev,noatime,inode64
        state: mounted

    # --- Disk I/O ---
    - name: Set blockdev read-ahead
      command: "/sbin/blockdev --setra 16384 {{ data_disk }}"
      changed_when: false

    - name: Set I/O scheduler via grubby (RHEL/Rocky Linux)
      command: grubby --update-kernel=ALL --args="elevator=mq-deadline"
      ignore_errors: yes
      changed_when: false
      when: ansible_os_family == "RedHat"

    - name: Set I/O scheduler via grub (Ubuntu)
      shell: |
        if grep -q "elevator=mq-deadline" /etc/default/grub; then
          echo "elevator already set, skipping"
        else
          sed -i 's/GRUB_CMDLINE_LINUX="\(.*\)"/GRUB_CMDLINE_LINUX="\1 elevator=mq-deadline"/' /etc/default/grub
          update-grub
          echo "elevator set"
        fi
      args:
        executable: /bin/bash
      when: ansible_os_family == "Debian"
      register: grub_elevator_result
      changed_when: "'elevator set' in grub_elevator_result.stdout"

    # --- THP ---
    - name: Disable Transparent Huge Pages via grubby (RHEL/Rocky Linux)
      command: grubby --update-kernel=ALL --args="transparent_hugepage=never"
      ignore_errors: yes
      changed_when: false
      when: ansible_os_family == "RedHat"

    - name: Disable Transparent Huge Pages via grub (Ubuntu)
      shell: |
        if grep -q "transparent_hugepage=never" /etc/default/grub; then
          echo "THP already disabled, skipping"
        else
          sed -i 's/GRUB_CMDLINE_LINUX="\(.*\)"/GRUB_CMDLINE_LINUX="\1 transparent_hugepage=never"/' /etc/default/grub
          update-grub
          echo "THP disabled"
        fi
      args:
        executable: /bin/bash
      when: ansible_os_family == "Debian"
      register: grub_thp_result
      changed_when: "'THP disabled' in grub_thp_result.stdout"

    # --- IPC ---
    - name: Disable IPC object removal
      lineinfile:
        path: /etc/systemd/logind.conf
        regexp: "^#?RemoveIPC="
        line: "RemoveIPC=no"
      notify: restart systemd-logind

    # --- SSH threshold ---
    - name: Set SSH MaxStartups
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?MaxStartups"
        line: "MaxStartups 10:30:200"
      notify: restart sshd

    - name: Set SSH MaxSessions
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?MaxSessions"
        line: "MaxSessions 200"
      notify: restart sshd

    # --- Clock sync ---
    # RHEL/Rocky Linux uses chronyd; Ubuntu uses chrony (package name differs)
    - name: Enable and start chronyd (RHEL/Rocky Linux)
      systemd:
        name: chronyd
        state: started
        enabled: yes
      when: ansible_os_family == "RedHat"

    - name: Enable and start chrony (Ubuntu)
      systemd:
        name: chrony
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"

    # --- gpadmin user ---
    - name: Create gpadmin group
      group:
        name: "{{ cloudberry_admin_user }}"
        state: present

    - name: Create gpadmin user
      user:
        name: "{{ cloudberry_admin_user }}"
        group: "{{ cloudberry_admin_user }}"
        system: yes
        create_home: yes
        password: "{{ cloudberry_admin_password | password_hash('sha512') }}"

    - name: Add gpadmin to wheel group and enable NOPASSWD sudo (RHEL/Rocky Linux)
      user:
        name: "{{ cloudberry_admin_user }}"
        groups: wheel
        append: yes
      when: ansible_os_family == "RedHat"

    - name: Ensure wheel group has NOPASSWD sudo (RHEL/Rocky Linux)
      lineinfile:
        path: /etc/sudoers
        regexp: "^%wheel"
        line: "%wheel ALL=(ALL) NOPASSWD: ALL"
        validate: "visudo -cf %s"
      when: ansible_os_family == "RedHat"

    - name: Add gpadmin to sudo group (Ubuntu)
      user:
        name: "{{ cloudberry_admin_user }}"
        groups: sudo
        append: yes
      when: ansible_os_family == "Debian"

    - name: Create sudoers drop-in file for gpadmin (Ubuntu)
      copy:
        content: "gpadmin ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/gpadmin
        mode: "0440"
        validate: "visudo -cf %s"
      when: ansible_os_family == "Debian"

    - name: Set data directory ownership
      file:
        path: "{{ data_mount }}"
        owner: "{{ cloudberry_admin_user }}"
        group: "{{ cloudberry_admin_user }}"
        recurse: yes

  handlers:
    - name: restart systemd-logind
      service:
        name: systemd-logind
        state: restarted

    - name: restart sshd
      service:
        name: sshd
        state: restarted

# --- Install Apache Cloudberry ---
- name: Install Apache Cloudberry package
  hosts: cloudberry
  become: yes
  tasks:
    - name: Copy package to host
      copy:
        src: "{{ package_path }}"
        dest: "/tmp/{{ package_path | basename }}"

    - name: Install package (RPM)
      yum:
        name: "/tmp/{{ package_path | basename }}"
        state: present
        disable_gpg_check: yes
      when: ansible_os_family == "RedHat"

    - name: Install package (DEB)
      apt:
        deb: "/tmp/{{ package_path | basename }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Cleanup package file
      file:
        path: "/tmp/{{ package_path | basename }}"
        state: absent

    - name: Set installation directory ownership
      shell: chown -R {{ cloudberry_admin_user }}:{{ cloudberry_admin_user }} /usr/local/cloudberry*
      changed_when: false

# --- Configure SSH and initialize (coordinator only) ---
- name: Configure passwordless SSH and initialize cluster
  hosts: coordinator
  become: yes
  become_user: "{{ cloudberry_admin_user }}"
  vars:
    cloudberry_admin_user: "gpadmin"
  tasks:
    - name: Create .ssh directory for gpadmin
      file:
        path: "/home/{{ cloudberry_admin_user }}/.ssh"
        state: directory
        owner: "{{ cloudberry_admin_user }}"
        group: "{{ cloudberry_admin_user }}"
        mode: "0700"

    - name: Generate SSH key for gpadmin
      openssh_keypair:
        path: "/home/{{ cloudberry_admin_user }}/.ssh/id_rsa"
        type: rsa
        size: 4096
        owner: "{{ cloudberry_admin_user }}"
        group: "{{ cloudberry_admin_user }}"

    - name: Fetch gpadmin public key from coordinator
      slurp:
        src: "/home/{{ cloudberry_admin_user }}/.ssh/id_rsa.pub"
      register: gpadmin_pubkey

    - name: Distribute SSH public key to all hosts
      authorized_key:
        user: "{{ cloudberry_admin_user }}"
        key: "{{ gpadmin_pubkey.content | b64decode }}"
      delegate_to: "{{ item }}"
      loop: "{{ groups['cloudberry'] }}"

    - name: Create hostfile_exkeys
      copy:
        content: "{{ groups['cloudberry'] | join('\n') }}\n"
        dest: "/home/{{ cloudberry_admin_user }}/hostfile_exkeys"

    - name: Create hostfile_gpinitsystem
      copy:
        content: "{{ groups['segments'] | join('\n') }}\n"
        dest: "/home/{{ cloudberry_admin_user }}/hostfile_gpinitsystem"

    - name: Scan and trust host keys for all cluster nodes
      known_hosts:
        name: "{{ item }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -H ' + item) }}"
        state: present
        path: "/home/{{ cloudberry_admin_user }}/.ssh/known_hosts"
      loop: "{{ groups['cloudberry'] }}"

    - name: Run gpssh-exkeys
      shell: |
        source /usr/local/cloudberry-db/cloudberry-env.sh
        gpssh-exkeys -f /home/{{ cloudberry_admin_user }}/hostfile_exkeys
      args:
        executable: /bin/bash

    - name: Create data root directory as root
      file:
        path: "{{ coordinator_data_dir | dirname }}"
        state: directory
        owner: "{{ cloudberry_admin_user }}"
        group: "{{ cloudberry_admin_user }}"
        mode: "0755"
      become: yes
      become_user: root

    - name: Create coordinator data directory
      file:
        path: "{{ coordinator_data_dir }}"
        state: directory
        owner: "{{ cloudberry_admin_user }}"
        group: "{{ cloudberry_admin_user }}"

- name: Create data directories on standby
  hosts: standby
  become: yes
  tasks:
    - name: Create data root directory on standby
      file:
        path: "{{ coordinator_data_dir | dirname }}"
        state: directory
        owner: "{{ cloudberry_admin_user }}"
        group: "{{ cloudberry_admin_user }}"
        mode: "0755"

    - name: Create coordinator data directory on standby
      file:
        path: "{{ coordinator_data_dir }}"
        state: directory
        owner: "{{ cloudberry_admin_user }}"
        group: "{{ cloudberry_admin_user }}"

    - name: Create .ssh directory for gpadmin on standby
      file:
        path: "/home/{{ cloudberry_admin_user }}/.ssh"
        state: directory
        owner: "{{ cloudberry_admin_user }}"
        group: "{{ cloudberry_admin_user }}"
        mode: "0700"

- name: Create data directories on segments
  hosts: segments
  become: yes
  tasks:
    - name: Create data root directory on segments
      file:
        path: "{{ primary_data_dir | dirname }}"
        state: directory
        owner: "{{ cloudberry_admin_user }}"
        group: "{{ cloudberry_admin_user }}"
        mode: "0755"

    - name: Create primary data directory
      file:
        path: "{{ primary_data_dir }}"
        state: directory
        owner: "{{ cloudberry_admin_user }}"
        group: "{{ cloudberry_admin_user }}"

    - name: Create mirror data directory
      file:
        path: "{{ mirror_data_dir }}"
        state: directory
        owner: "{{ cloudberry_admin_user }}"
        group: "{{ cloudberry_admin_user }}"

- name: Initialize Apache Cloudberry cluster
  hosts: coordinator
  become: yes
  become_user: "{{ cloudberry_admin_user }}"
  vars:
    cloudberry_admin_user: "gpadmin"
  tasks:
    - name: Create gpconfigs directory
      file:
        path: "/home/{{ cloudberry_admin_user }}/gpconfigs"
        state: directory

    - name: Create gpinitsystem config
      copy:
        content: |
          SEG_PREFIX=gpseg
          PORT_BASE={{ port_base }}
          declare -a DATA_DIRECTORY=({% for i in range(segments_per_host) %}{{ primary_data_dir }} {% endfor %})
          COORDINATOR_HOSTNAME={{ coordinator_hostname }}
          COORDINATOR_DIRECTORY={{ coordinator_data_dir }}
          COORDINATOR_PORT={{ coordinator_port }}
          TRUSTED_SHELL=ssh
          CHECK_POINT_SEGMENTS=8
          ENCODING=UNICODE
          MIRROR_PORT_BASE={{ mirror_port_base }}
          declare -a MIRROR_DATA_DIRECTORY=({% for i in range(segments_per_host) %}{{ mirror_data_dir }} {% endfor %})
          DATABASE_NAME={{ database_name }}
        dest: "/home/{{ cloudberry_admin_user }}/gpconfigs/gpinitsystem_config"

    - name: Check if cluster is already initialized
      stat:
        path: "{{ coordinator_data_dir }}/gpseg-1/PG_VERSION"
      register: pgversion_stat
      become: yes
      become_user: root

    - name: Run gpinitsystem
      shell: |
        source /usr/local/cloudberry-db/cloudberry-env.sh
        yes | gpinitsystem -c /home/{{ cloudberry_admin_user }}/gpconfigs/gpinitsystem_config \
            -h /home/{{ cloudberry_admin_user }}/hostfile_gpinitsystem \
            -s {{ standby_hostname }} --mirror-mode=spread
      args:
        executable: /bin/bash
      register: gpinitsystem_result
      failed_when: "'successfully created' not in gpinitsystem_result.stdout"
      when: not pgversion_stat.stat.exists

    - name: Set environment variables in .bashrc
      blockinfile:
        path: "/home/{{ cloudberry_admin_user }}/.bashrc"
        block: |
          source /usr/local/cloudberry-db/cloudberry-env.sh
          export COORDINATOR_DATA_DIRECTORY={{ coordinator_data_dir }}/gpseg-1
          export PGPORT={{ coordinator_port }}
          export PGUSER={{ cloudberry_admin_user }}
          export PGDATABASE={{ database_name }}
        marker: "# {mark} CLOUDBERRY ENVIRONMENT"

    - name: Sync .bashrc to standby coordinator
      shell: |
        scp /home/{{ cloudberry_admin_user }}/.bashrc \
            {{ standby_hostname }}:/home/{{ cloudberry_admin_user }}/.bashrc
      args:
        executable: /bin/bash

    - name: Verify standby coordinator is synchronized
      shell: |
        source /usr/local/cloudberry-db/cloudberry-env.sh
        source /home/{{ cloudberry_admin_user }}/.bashrc
        gpstate -f
      args:
        executable: /bin/bash
      register: gpstate_result
      changed_when: false
      failed_when: false

    - name: Initialize standby coordinator if not already active
      shell: |
        source /usr/local/cloudberry-db/cloudberry-env.sh
        source /home/{{ cloudberry_admin_user }}/.bashrc
        if ! gpstate -f 2>&1 | grep -q "Sync state: sync"; then
          yes | gpinitstandby -s {{ standby_hostname }}
        else
          echo "Standby already synchronized, skipping gpinitstandby"
        fi
      args:
        executable: /bin/bash
      register: gpinitstandby_result
      changed_when: "'skipping' not in gpinitstandby_result.stdout"

    - name: Display success message
      debug:
        msg:
          - "=========================================="
          - " Apache Cloudberry cluster initialized successfully!"
          - "=========================================="
          - " Connect to the database:"
          - "   su - gpadmin"
          - "   psql -d {{ database_name }}"
          - "=========================================="

    - name: Check postgres --gp-version
      command: /usr/local/cloudberry-db/bin/postgres --gp-version
      register: gp_version
      changed_when: false

    - name: Check postgres --version
      command: /usr/local/cloudberry-db/bin/postgres --version
      register: pg_version
      changed_when: false

    - name: Show version info
      debug:
        msg:
          - "{{ gp_version.stdout }}"
          - "{{ pg_version.stdout }}"
